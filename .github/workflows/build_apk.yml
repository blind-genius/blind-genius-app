name: Build Blind Genius Android APK

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: 'stable'
          cache: true

      - name: Check Flutter Doctor
        run: flutter doctor -v

      - name: Get Dependencies
        run: flutter pub get

      - name: Verify Code Formatting & Analysis
        run: |
          flutter analyze --no-fatal-infos || true

      - name: Build Android Release APK
        run: flutter build apk --release

      - name: Rename APK for Easy Identification
        run: |
          mkdir -p build-output
          cp build/app/outputs/flutter-apk/app-release.apk build-output/BlindGenius-v1.0.0-release.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BlindGenius-Release-APK
          path: build-output/BlindGenius-v1.0.0-release.apk
          retention-days: 14
          if-no-files-found: error
