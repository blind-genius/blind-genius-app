name: Build Blind Genius Android APK

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: 'stable'
          cache: true

      - name: Check Flutter Doctor
        run: flutter doctor -v

      - name: Get Dependencies
        run: flutter pub get

      - name: Verify Code Formatting & Analysis
        run: |
          flutter analyze --no-fatal-infos || true

      - name: Build Android Release APK
        run: flutter build apk --release

      - name: Rename APK for Easy Identification
        run: |
          mkdir -p build-output
          cp build/app/outputs/flutter-apk/app-release.apk build-output/BlindGenius-v1.0.2-release.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BlindGenius-Release-APK
          path: build-output/BlindGenius-v1.0.2-release.apk
          retention-days: 14
          if-no-files-found: error

      - name: Publish to GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.2
          name: Blind Genius v1.0.2 (Dynamic Remote Sync & 25 Tracks)
          files: build-output/BlindGenius-v1.0.2-release.apk
          draft: false
          prerelease: false
          body: |
            نسخه جدید و رسمی اپلیکیشن نابغه نابینا (Blind Genius v1.0.2)
            - مجهز به دریافت خودکار و آنلاین قطعات جدید از طریق فایل رمزگذاری‌شده AES-256
            - بدون نیاز به آپدیت دوباره برنامه با ارسال آهنگ‌های جدید در تلگرام
            - دارای ۲۵ قطعه موسیقی واقعی (شامل آهنگ جدید بی‌قرار از معین)
            - دکمه همگام‌سازی دسترس‌پذیر و پشتیبانی کامل از TalkBack
            - امضا شده با کلید رسمی دائمی (Release Keystore)


